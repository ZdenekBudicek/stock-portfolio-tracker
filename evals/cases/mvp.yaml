# MVP eval cases over the synthetic fixture (supabase/functions/agent/fixtures/demo.json, today 2026-10-23).
# User A: CZ residence, SYNA/SYNB/BTC dust + cash, SYNA sold in 2026. User B: SK residence with a 2026 profile, SYNC.
# User C: residence outside every Trackora tax model (OTHER). User D: CZ, SYND bought 2014-06-02, before the first
# rate of the bundled ČNB file (2015-01-02), sold in 2026 — its purchase FX stays missing whatever the daily ČNB
# refresh adds. User E: an empty account.
# Golden values come from POST /agent/tools over the same snapshot (independent of the chat path); the scorer
# never trusts them as evidence of the answer, it only requires them, with their meaning, period and sign.
# Golden fact_ids are the required data of the intent (Běh 15 contract): every one must be in the answer.
# The deterministic models themselves are covered by the accounting regressions of runs 2–5, not here.
# 50 scenarios: 28 cs / 10 sk / 12 en (30 MVP + 3 data-quality users + 4 semantic negatives + 8 production-fix cases + 5 move cases). After any change run
# `python -m trackora_evals.manifest` (evals/cases/required.json is what the release gate requires).
# Optional keys: expect_insufficient, expect_error, forbid, require, note.
cases:
  # --- transactions / realized (5)
  - id: tx-cs-1
    lang: cs
    user: A
    scenario: transactions
    turns: ["Kolik jsem letos nakoupil a prodal?"]
    expect_tools: [get_transactions]
    golden:
      - {tool: get_transactions, args: {from: "2026-01-01", to: "2026-10-23"}, fact_ids: ["transactions:all:count", "transactions:all:buy_count", "transactions:all:sell_count", "transactions:all:buy_usd", "transactions:all:sell_usd", "transactions:all:bought_shares", "transactions:all:sold_shares"]}
    expect_verdict: false
  - id: tx-cs-ticker
    lang: cs
    user: A
    scenario: transactions
    turns: ["Kolik kusů SYNA jsem letos prodal?"]
    expect_tools: [get_transactions]
    golden:
      - {tool: get_transactions, args: {from: "2026-01-01", to: "2026-10-23", ticker: SYNA}, fact_ids: ["transactions:SYNA:sold_shares"]}
    expect_verdict: false
  - id: realized-cs-1
    lang: cs
    user: A
    scenario: realized
    turns: ["Jaký zisk jsem letos realizoval?"]
    expect_tools: [get_realized_pnl]
    golden:
      - {tool: get_realized_pnl, args: {from: "2026-01-01", to: "2026-10-23", currency: CZK}, fact_ids: ["realized:2026:net", "realized:2026:gains", "realized:2026:losses", "realized:2026:proceeds"]}
    expect_verdict: false
  - id: tx-sk-1
    lang: sk
    user: B
    scenario: transactions
    turns: ["Koľko som tento rok nakúpil a predal?"]
    expect_tools: [get_transactions]
    golden:
      - {tool: get_transactions, args: {from: "2026-01-01", to: "2026-10-23"}, fact_ids: ["transactions:all:count"]}
    expect_verdict: false
  - id: tx-en-1
    lang: en
    user: A
    scenario: transactions
    turns: ["How much did I buy and sell this year?"]
    expect_tools: [get_transactions]
    golden:
      - {tool: get_transactions, args: {from: "2026-01-01", to: "2026-10-23"}, fact_ids: ["transactions:all:count", "transactions:all:buy_count", "transactions:all:sell_count", "transactions:all:buy_usd", "transactions:all:sell_usd", "transactions:all:bought_shares", "transactions:all:sold_shares"]}
    expect_verdict: false

