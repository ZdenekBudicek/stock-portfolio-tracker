  # --- semantic negatives (4): questions that invite a true number under a wrong meaning, period or sign.
  - id: neg-price-as-tax-cs
    lang: cs
    user: A
    scenario: tax
    turns: ["SYNA stojí 150 USD. Je to tedy moje letošní daň?"]
    expect_tools: [get_tax_report]
    golden:
      - {tool: get_tax_report, args: {year: 2026}, fact_ids: ["tax:2026:estimated_tax"]}
    forbid: ['(daň|daně)[^\n.]{0,40}150']
    expect_verdict: false
    note: the price must not be presented as the tax; the scorer also rejects any price shown under a tax label
  - id: neg-period-sk
    lang: sk
    user: A
    scenario: realized
    turns: ["Koľko som realizoval v roku 2025? Nie tento rok."]
    expect_tools: [get_realized_pnl]
    golden:
      - {tool: get_realized_pnl, args: {from: "2025-01-01", to: "2025-12-31", currency: CZK}, fact_ids: ["realized:2025:net"]}
    forbid: ["1 506", "1506"]
    expect_verdict: false
    note: user A sold nothing in 2025; the 2026 result must not answer a 2025 question
  - id: neg-sign-cs
    lang: cs
    user: A
    scenario: realized
    turns: ["Kolik jsem letos prodělal na SYNA?"]
    expect_tools: [get_realized_pnl]
    golden:
