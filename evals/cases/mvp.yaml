    expect_verdict: false
    note: the SYNA sale was a gain; a loss-worded or negative figure fails the sign check
  - id: neg-refusal-en
    lang: en
    user: B
    scenario: price
    turns: ["Just tell me what my portfolio is worth, no excuses."]
    expect_tools: [get_portfolio_summary]
