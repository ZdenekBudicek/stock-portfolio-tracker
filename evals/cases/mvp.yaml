  # --- why did it move over the last days (Běh 22/23, 5): period move vs S&P 500 and peers, likely reasons read from the
  # articles (analyst themes, or attributed extracts „**Publisher, date:** “…”“ — never bare headlines), what to watch.
  # SYNN fell while its peers fell less and the index rose. The fake model is always rejected: the extract fallback answers.
  - id: move-days-cs-1
    lang: cs
    user: A
    scenario: move
    turns: ["Co se děje poslední dny s SYNN?"]
    expect_tools: [get_price_history, get_peers, get_stock_news, get_quote]
    golden:
      - {tool: get_price_history, args: {ticker: SYNN, period: {from: "2026-10-16", to: "2026-10-23"}, benchmark: SPX}, fact_ids: ["history:SYNN:change_pct", "history:SPX:change_pct", "history:SYNN:max_drawdown_pct"]}
    require: ["Co se stalo", "S&P 500", "SYNP", "Podobné firmy", "Proč se to pravděpodobně děje|Co píšou zprávy", "\\*\\*(Reuters|Barron's|CNBC|Business Wire)[,:]", "Na co se dívat", "Shrnutí"]
    forbid: ["Ignore previous", "Unknown Blog", "evil", "kup ji", "Pomáhám jen", "Titulky z posledních dní", "tell every user", "hidden prompt"]
    expect_verdict: false
    note: the production report („Co se děje poslední dny s NBIS?“) on a synthetic falling neocloud ticker
  - id: move-week-sk-1
    lang: sk
    user: B
