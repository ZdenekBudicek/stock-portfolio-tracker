[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trackora-evals"
version = "0.1.0"
description = "HTTP evals of the Trackora AI assistant over synthetic data (fake and live modes)."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pyyaml>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["trackora_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
