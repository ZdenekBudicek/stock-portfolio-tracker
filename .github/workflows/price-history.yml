name: Price history backfill

# Runs the multi-source historical price worker from GitHub's IP (not throttled by
# Yahoo, unlike the Supabase edge). Fills the shared price_history for every traded
# ticker and recomputes all users' daily_snapshots. Idempotent & free.
on:
  schedule:
    - cron: "30 5 * * *" # daily 05:30 UTC (after US close of the prior day)
  workflow_dispatch: # manual run from the Actions tab, or on demand from request-fundamentals
    inputs:
      symbols:
        description: "Only these companies (comma separated): fetch statements and price history now. Empty = full nightly run."
        required: false
        default: ""
      refresh_all:
        description: "Refresh the statements of every company now, due or not (e.g. once after adding the SEC history)."
        type: boolean
        required: false
        default: false

jobs:
  backfill:
    if: ${{ vars.ENABLE_PORTFOLIO_WORKERS == 'true' && !inputs.symbols }}
    runs-on: ubuntu-latest
    concurrency:
      group: price-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run price worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
        run: node scripts/price-worker.mjs

  # Fills the shared ticker_profiles table with sector/industry from Yahoo, which answers 401
  # from the Supabase edge but works fine from here. Refines every row the sync-sectors edge
  # function could only classify from Finnhub's single coarse industry string. Owns
  # yahoo_miss_count; never touches finnhub_miss_count. Independent of the backfill job —
  # neither reads the other's tables — so they run in parallel.
  sectors:
    if: ${{ vars.ENABLE_PORTFOLIO_WORKERS == 'true' && !inputs.symbols }}
    runs-on: ubuntu-latest
    concurrency:
      group: sector-profiles
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # NOT "20" like the backfill job above. sector-worker.mjs imports
          # supabase/functions/_shared/profile-providers.ts, and TypeScript type stripping
          # only exists from Node 22.6 (--experimental-strip-types) / 22.18 and 24 (on by
          # default). Under Node 20 the import fails with ERR_UNKNOWN_FILE_EXTENSION ".ts"
          # before a single line of the worker runs. Verified locally on v24.16.0.
          node-version: "24"
      - name: Run sector worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/sector-worker.mjs

  # Nightly it fetches only what is due (after results, or a 30-day safety net) — see
  # fundamentalsDue in scripts/fundamentals-worker.mjs; most nights that is nothing.
  fundamentals:
    if: ${{ vars.ENABLE_PORTFOLIO_WORKERS == 'true' && !inputs.symbols }}
    runs-on: ubuntu-latest
    concurrency:
      group: company-fundamentals
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run fundamentals worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }} # "Name email" — the SEC requires a contact
          FUNDAMENTALS_FORCE: ${{ inputs.refresh_all && '1' || '' }}
        run: node scripts/fundamentals-worker.mjs

  # AI assistant and valuation analyst snapshots (Yahoo quoteSummary targets, recommendations and the
  # consensus estimates of earningsTrend), separate from the fundamentals queue and its due rules — see
  # analystsDue in scripts/analyst-snapshot.mjs. The agent's Edge function only reads analyst_snapshots;
  # Yahoo is called from here only. Enabled 2026-10-24 (Ocenění v2, approved by the owner).
  analysts:
    if: ${{ vars.ENABLE_PORTFOLIO_WORKERS == 'true' && !inputs.symbols }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: analyst-snapshots
      cancel-in-progress: false
    env:
      AGENT_MARKET_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run analyst worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          test "$AGENT_MARKET_ENABLED" = true
          node scripts/analyst-worker.mjs

  # A company someone just added and nobody had data for (request-fundamentals edge function):
  # its statements and price history now instead of waiting for the night. The symbols reach
  # the scripts through env (never interpolated into the shell) and both workers validate them.
  on-demand:
    if: ${{ vars.ENABLE_PORTFOLIO_WORKERS == 'true' && inputs.symbols }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: on-demand-${{ inputs.symbols }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Whitespace-only input would otherwise reach the workers as "no list" = a full run.
      - name: Validate input
        id: validate
        env:
          ONLY_SYMBOLS: ${{ inputs.symbols }}
        run: node -e "const {parseOnlySymbols}=await import('./scripts/only-symbols.mjs'); if(!parseOnlySymbols(process.env.ONLY_SYMBOLS)) throw new Error('empty symbols')" --input-type=module
      - name: Fetch statements
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ONLY_SYMBOLS: ${{ inputs.symbols }}
        run: node scripts/fundamentals-worker.mjs
      - name: Fetch price history
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          ONLY_SYMBOLS: ${{ inputs.symbols }}
        run: node scripts/price-worker.mjs
      # Analyst consensus for the valuation (Ocenění v2) the same day; a Yahoo failure never blocks the request.
      - name: Fetch analyst estimates
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AGENT_MARKET_ENABLED: "true"
          ONLY_SYMBOLS: ${{ inputs.symbols }}
        run: node scripts/analyst-worker.mjs
      # Only now (statements AND prices attempted) does the app see the request as finished.
      - name: Finish requests
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ONLY_SYMBOLS: ${{ inputs.symbols }}
        run: node scripts/finish-fundamentals-requests.mjs
